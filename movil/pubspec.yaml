name: t4_movil
description: Consulta móvil de envíos por número de guía.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.13.5
dependencies:
  http: ^1.6.0
  flutter_secure_storage: 10.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  mobile_scanner: 7.5.0
  camera: ^0.12.2
  permission_handler: 12.0.1
  open_filex: ^5.0.0
  path_provider: ^2.1.6
  http_parser: ^4.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/licenses/
  fonts:
    - family: PrimeIcons
      fonts:
        - asset: assets/fonts/primeicons.ttf
